# rustfmt.toml (project root)
edition = "2021"            # use "2024" if your Cargo.toml does
max_width = 100             # the default, stated explicitly
use_small_heuristics = "Default"
newline_style = "Unix"
reorder_imports = true
reorder_modules = true
use_field_init_shorthand = true   # Foo { x } instead of Foo { x: x }
use_try_shorthand = true          # ? instead of try!()
imports_granularity = "Crate"     # merge imports from the same crate
group_imports = "StdExternalCrate" # std, then external crates, then local
wrap_comments = true
comment_width = 100
format_code_in_doc_comments = true
